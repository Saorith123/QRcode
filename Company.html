<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធ Login ចូលប្រើប្រាស់</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f2f5;
        }

        /* ទម្រង់ Login */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background-color: #f0f2f5;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 380px;
        }
        .login-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        /* ផ្នែកបង្ហាញកម្មវិធី (App View) */
        #appFrame {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }

        /* ផ្ទាំង Popup សួរបញ្ជាក់ (Custom Confirm Dialog) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #fff;
            padding: 20px 25px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-box p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes {
            background-color: #dc3545;
            color: white;
        }
        .btn-no {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

    <!-- ទម្រង់ Login -->
    <div class="login-container" id="loginScreen">
        <div class="login-card">
            <h2>ចូលប្រើប្រាស់</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="បញ្ចូល Username..." required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="បញ្ចូល Password..." required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
                <div id="errorMessage" class="error-message">Username ឬ Password មិនត្រឹមត្រូវទេ!</div>
            </form>
        </div>
    </div>

    <!-- ផ្នែកផ្ទុក App / Link ដែលត្រូវលាក់ -->
    <iframe id="appFrame" src=""></iframe>

    <!-- Popup សួរបញ្ជាក់ពេលចុច Back -->
    <div class="modal-overlay" id="exitModal">
        <div class="modal-box">
            <p>តើអ្នកចង់ចាកចេញពីកម្មវិធីនេះមែនទេ?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-yes" id="btnYes">បាទ / ចាស</button>
                <button class="modal-btn btn-no" id="btnNo">ទេ</button>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================
        // ទីនេះជាកន្លែងបន្ថែម ឬកែប្រែ Username, Password និង Link
        // ==============================================================
        const userDatabase = [
            {
                username: "RS",
                password: "168",
                redirectUrl: "https://psnb.app/Phone"
            },
            {
                username: "admin",
                password: "123",
                redirectUrl: "https://google.com"
            }
        ];

        let isLoggedIn = false;

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const errorElement = document.getElementById('errorMessage');

            const matchedUser = userDatabase.find(
                acc => acc.username === inputUser && acc.password === inputPass
            );

            if (matchedUser) {
                errorElement.style.display = 'none';
                isLoggedIn = true;
                
                // លាក់ទម្រង់ Login 
                document.getElementById('loginScreen').style.display = 'none';
                
                // បើក App ក្នុង iframe
                const iframe = document.getElementById('appFrame');
                iframe.src = matchedUser.redirectUrl;
                iframe.style.display = 'block';

                // បន្ថែម State ទៅក្នុង History ដើម្បីស្ទាក់ប៊ូតុង Back
                history.pushState({ page: 'app' }, '', '');
            } else {
                errorElement.style.display = 'block';
            }
        });

        // ស្ទាក់ព្រឹត្តិការណ៍ចុចប៊ូតុង Back លើទូរស័ព្ទ
        window.addEventListener('popstate', function(event) {
            if (isLoggedIn) {
                // បង្ហាញ Popup សួរបញ្ជាក់
                document.getElementById('exitModal').style.style ? document.getElementById('exitModal').style.display = 'flex' : document.getElementById('exitModal').setAttribute('style', 'display: flex;');
                
                // រក្សា State ដដែលដើម្បីកុំឱ្យវាថយក្រោយភ្លាមៗ
                history.pushState({ page: 'app' }, '', '');
            }
        });

        // ប្រសិនបើចុច "បាទ / ចាស" -> ចាកចេញ (ត្រឡប់ទៅ Login វិញ)
        document.getElementById('btnYes').addEventListener('click', function() {
            isLoggedIn = false;
            document.getElementById('exitModal').style.display = 'none';
                
            // បិទ App ហើយបង្ហាញ Login វិញ
            document.getElementById('appFrame').style.display = 'none';
            document.getElementById('appFrame').src = '';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });

        // ប្រសិនបើចុច "ទេ" -> បិទ Popup ហើយនៅទីនេះដដែល
        document.getElementById('btnNo').addEventListener('click', function() {
            document.getElementById('exitModal').style.display = 'none';
        });
    </script>

</body>
</html>
