function toTitleCase(str) {
    return str.toLowerCase().split(' ').map(word => {
        if (!word) return '';
        return word.charAt(0).toUpperCase() + word.slice(1);
    }).join(' ');
}

function autoRomanizeAddress(str) {
    if (!str) return "";
    let res = str;
    res = res.replace(/[\u17D2\u17CB\u17CC\u17CD\u17CE\u17CF\u17D0]/g, '');

    for (let key in khmerToLatinDict) {
        let regex = new RegExp(key, 'g');
        res = res.replace(regex, khmerToLatinDict[key] + " ");
    }
    
    const charMap = {
        'ក':'k','ខ':'kh','គ':'k','ឃ':'kh','ង':'ng','ច':'ch','ឆ':'ch','ជ':'ch','ឈ':'ch','ញ':'nh',
        'ដ':'d','ឋ':'th','ឌ':'d','ឍ':'th','ណ':'n','ត':'t','ថ':'th','ទ':'t','ធ':'th','ន':'n',
        'ប':'b','ផ':'ph','ព':'p','ភ':'ph','ម':'m','យ':'y','រ':'r','ល':'l','វ':'v','ស':'s',
        'ហ':'h','ឡ':'l','អ':'o','ា':'a','ិ':'i','ី':'ey','ឹ':'ue','ឺ':'eu','ុ':'u','ូ':'ou',
        'ួ':'uo','ើ':'eu','ឿ':'oea','ៀ':'ie','េ':'ae','ែ':'ae','ៃ':'ai','ោ':'ao','ៅ':'au'
    };
    let cleanRes = "";
    for(let char of res) {
        if(charMap[char]) {
            cleanRes += charMap[char];
        } else {
            cleanRes += char;
        }
    }
    
    let formatted = cleanRes.replace(/\s+/g, ' ').trim();
    return toTitleCase(formatted);
}

function generateRandom8Chars() {
    const letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const digits = "0123456789";
    let numDigitsCount = Math.floor(Math.random() * 2) + 1; 
    let result = [];
    for (let i = 0; i < numDigitsCount; i++) {
        result.push(digits.charAt(Math.floor(Math.random() * digits.length)));
    }
    for (let i = 0; i < (8 - numDigitsCount); i++) {
        result.push(letters.charAt(Math.floor(Math.random() * letters.length)));
    }
    return result.sort(() => 0.5 - Math.random()).join('');
}

function generateNewHash() {
    const newHash = generateRandom8Chars();
    $('#hashInput').val(newHash);
    updateQRAndFileName();
}

function toggleOldHashInput() {
    const isChecked = $('#useOldHash').is(':checked');

    } else {

        $('#btnGenNewHash').prop('disabled', false);

    }

function getFramedQRBlob(callback) {
    const qrImg = document.querySelector('#qrcode img');
    if (!qrImg || !qrImg.src) {
        alert("QR Code មិនទាន់បង្កើតរួចរាល់!");
        return;
    }

    const img = new Image();
    img.src = qrImg.src;
    img.onload = function() {
        const padding = 25; 
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = img.width + (padding * 2);
        canvas.height = img.height + (padding * 2);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, padding, padding);

        canvas.toBlob(function(blob) {
            callback(blob);
        }, 'image/png');
    };
}

function downloadQRCodeImage() {
    getFramedQRBlob(function(blob) {
        const hash = $('#hashInput').val().trim();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `QR_${hash}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
}

            return khDay + ' ' + (monthsKhmer[monthIdx] || parts[1]) + ' ' + khYear;

async function executeDownloadHTML() {
    if (!verifyStaffAndInputs()) return;

    const htmlContent = generateHTMLContent();
    const fileName = $('#fileNameInput').val().trim() || 'document.html';

    // ប្រើប្រាស់ File System Access API (Save As Dialog) ប្រសិនបើ Browser គាំទ្រ
    if (window.showSaveFilePicker) {
        try {
            const options = {
                suggestedName: fileName,
                types: [{
                    description: 'HTML Files',
                    accept: { 'text/html': ['.html'] },
                }],
            };
            const handle = await window.showSaveFilePicker(options);
            const writable = await handle.createWritable();
            await writable.write(htmlContent);
            await writable.close();
            alert("រក្សាទុក File HTML (Save As) បានជោគជ័យ!");
            return;
        } catch (err) {
            // ប្រសិនបើអ្នកប្រើប្រាស់ចុច Cancel គឺមិនបាច់បង្ហាញ Error អ្វីទេ
            if (err.name !== 'AbortError') {
                console.log("Fallback to standard download: ", err);
            } else {
                return;
            }
        }
    }

    // វិធីសាស្ត្រជំនួស (Fallback) សម្រាប់ Browser ដែលមិនមាន showSaveFilePicker
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function executeSendTelegram() {
    if (!verifyStaffAndInputs()) return;

    const staffName = $('#staffSelect').val();
    const customer = $('#customerName').val().trim() || 'មិនបានបញ្ជាក់';
    const note = $('#operationNote').val().trim() || 'គ្មាន';

    const nameKh = $('#nameKh').val().trim();
    const nameEn = $('#nameEn').val().trim();
    const cardNo = $('#cardNo').val().trim();
    const citizenId = $('#citizenId').val().trim();
    const hash = $('#hashInput').val().trim();
    const fileName = $('#fileNameInput').val().trim();
    const qrUrl = $('#qrFullUrl').val().trim();

    const captionMessage = 
`📌 **របាយការណ៍បង្កើតទិន្នន័យប័ណ្ណបើកបរ**
----------------------------------
👤 **អតិថិជន:** ${customer}
👨‍គ **បុគ្គលិកប្រតិបត្តិការ:** ${staffName}
📝 **ចំណាំ:** ${note}

👤 **ឈ្មោះម្ចាស់បណ្ណ:** ${nameKh} (${nameEn})
💳 **លេខបណ្ណ:** ${cardNo}
🆔 **អត្តសញ្ញាណ:** ${citizenId}
🔑 **Code / Hash:** \`${hash}\`
📄 **ឈ្មោះ File:** \`${fileName}\`
🔗 **Link ផ្ទៀងផ្ទាត់:** ${qrUrl}`;

    getFramedQRBlob(function(qrBlob) {
        let formDataPhoto = new FormData();
        formDataPhoto.append("chat_id", TELEGRAM_CONFIG.chatId);
        formDataPhoto.append("photo", qrBlob, `QR_${hash}.png`);
        formDataPhoto.append("caption", captionMessage);
        formDataPhoto.append("parse_mode", "Markdown");

        fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendPhoto`, {
            method: "POST",
            body: formDataPhoto
        })
        .then(res => res.json())
        .then(dataPhoto => {
            if (!dataPhoto.ok) {
                alert("បរាជ័យក្នុងការផ្ញើរូបភាព QR Code ទៅ Telegram: " + dataPhoto.description);
                return;
            }

            const htmlContent = generateHTMLContent();
            const htmlBlob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });

            let formDataDoc = new FormData();
            formDataDoc.append("chat_id", TELEGRAM_CONFIG.chatId);
            formDataDoc.append("document", htmlBlob, fileName);
            formDataDoc.append("caption", `📄 File HTML សម្រាប់ទិន្នន័យ៖ ${nameKh} (${hash})`);

            return fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendDocument`, {
                method: "POST",
                body: formDataDoc
            });
        })
        .then(res => res ? res.json() : null)
        .then(dataDoc => {
            if (dataDoc && dataDoc.ok) {
                alert("ផ្ញើសារ រូបភាព QR Code និង File HTML ទៅ Telegram ได้ជោគជ័យ!");
            } else if (dataDoc) {
                alert("បរាជ័យក្នុងការផ្ញើ File HTML: " + dataDoc.description);
            }
        })
        .catch(err => {
            alert("មានបញ្ហាក្នុងការតភ្ជាប់ទៅ Telegram៖ " + err);
        });
    });
}
