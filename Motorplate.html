    <!-- Bootstrap CSS -->

    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>

        .generator-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .btn-download { background-color: #28a745; color: white; font-weight: bold; }
        .btn-telegram { background-color: #0088cc; color: white; font-weight: bold; }
        .btn-qr { background-color: #6f42c1; color: white; font-weight: bold; }

</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-10 col-md-offset-1 generator-card">
            <h3 class="form-header text-center"><strong>ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យ យានយន្ត និង បង្កើត QR Code</strong></h3>
            
            <form id="vehicleForm">
                <!-- ផ្នែកទី ១៖ ការផ្ទៀងផ្ទាត់បុគ្គលិក -->

                        <div class="col-md-6 form-group">

                                <option value="">-- សូមជ្រើសរើសបុគ្គលិក --</option>
                                <option value="បុគ្គលិក A">បុគ្គលិក A</option>
                                <option value="បុគ្គលិក B">បុគ្គលិក B</option>

                        <label>ឈ្មោះអតិថិជន (ជ្រើសរើស ឬ វាយបញ្ចូល)</label>

<script>
const TELEGRAM_CONFIG = {
    botToken: "8522069642:AAHgi2GZlAczve8NHd3UObcMpucz3t38PG0", 
    chatId: "-1003704314487"                          
};

const STAFF_CREDENTIALS = {
    "បុគ្គលិក A": "1234",
    "បុគ្គលិក B": "5678",
    "បុគ្គលិក C": "9999"
};

const BASE_URL = "https://ts.mqwt-govkh.com/";

function generateRandom8Chars() {
    const letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const digits = "0123456789";
    
    let numDigitsCount = Math.floor(Math.random() * 2) + 1; 
    let result = [];

    for (let i = 0; i < numDigitsCount; i++) {
        result.push(digits.charAt(Math.floor(Math.random() * digits.length)));
    }
    for (let i = 0; i < (8 - numDigitsCount); i++) {
        result.push(letters.charAt(Math.floor(Math.random() * letters.length)));
    }

    return result.sort(() => 0.5 - Math.random()).join('');
}

function generateNewHash() {
    const newHash = generateRandom8Chars();
    $('#hashInput').val(newHash);
    updateQRAndFileName();
}

function toggleOldHashInput() {
    const isChecked = $('#useOldHash').is(':checked');
    if (isChecked) {
        $('#hashInput').prop('readonly', false).focus();
        $('#btnGenNewHash').prop('disabled', true);
    } else {
        $('#hashInput').prop('readonly', true);
        $('#btnGenNewHash').prop('disabled', false);
        generateNewHash();
    }
}

function updateQRAndFileName() {
    let hash = $('#hashInput').val().trim();
    if (!hash) hash = "vOjsM8Z8";

    const fullUrl = BASE_URL + hash;
    const fileName = hash + ".html";

    $('#fileNameInput').val(fileName);
    $('#qrFullUrl').val(fullUrl);

    $('#qrcode').empty();
    new QRCode(document.getElementById("qrcode"), {
        text: fullUrl,
        width: 260,
        height: 260,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
}

function getFramedQRBlob(callback) {
    const qrImg = document.querySelector('#qrcode img');
    if (!qrImg || !qrImg.src) {
        alert("QR Code មិនទាន់បង្កើតរួចរាល់!");
        return;
    }

    const img = new Image();
    img.src = qrImg.src;
    img.onload = function() {
        const padding = 25; 
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = img.width + (padding * 2);
        canvas.height = img.height + (padding * 2);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(img, padding, padding);

        canvas.toBlob(function(blob) {
            callback(blob);
        }, 'image/png');
    };
}

function downloadQRCodeImage() {
    getFramedQRBlob(function(blob) {
        const hash = $('#hashInput').val().trim();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `QR_${hash}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
}

const singleColorMap = {
    "ខ្មៅ": "BLACK", "ស": "WHITE", "ក្រហម": "RED", "ខៀវ": "BLUE", 
    "លឿង": "YELLOW", "ប្រផេះ": "GRAY", "ទឹកប្រាក់": "SILVER", "បៃតង": "GREEN",
    "ត្នោត": "BROWN", "ទឹកក្រូច": "ORANGE", "ស្វាយ": "PURPLE", "ស៊ីជម្ពូ": "PINK", "មាស": "GOLD"
};

function translateColor(colorText) {
    let words = colorText.trim().split(/\s+/);
    let translatedWords = words.map(w => singleColorMap[w] || w.toUpperCase());
    return translatedWords.join(' ');
}

const typeMap = {

};

const provinceMapUpper = {

    "កំពង់ចាម": "KAMPONG CHAM", "កំពង់ឆ្នាំង": "KAMPONG CHHNANG", "កំពង់ធំ": "KAMPONG THOM", "កំពង់ស្ពឺ": "KAMPONG SPEU",
    "កំពត": "KAMPOT", "ក្រចេះ": "KRATIE", "តាកែវ": "TAKEO", "ត្បូងឃ្មុំ": "TBOUNG KHMUM", "បន្ទាយមានជ័យ": "BANTEAY MEANCHEY",

function translateProvince(text, map) {
    for (let kh in map) {
        if (text.includes(kh)) {
            return text.replace(kh, map[kh]);
        }
    }
    return text;
}

function autoTranslateToEnglish() {
    let plateVal = $('#plate').val().trim();
    let colorVal = $('#color').val().trim();

    $('#enPlateUpper').val(translateProvince(plateVal, provinceMapUpper));
    $('#enPlateVal').val(translateProvince(plateVal, provinceMapTitle));
    $('#enColor').val(translateColor(colorVal));
    $('#enType').val(typeMap[typeVal] ? typeMap[typeVal] : "Motocycle");
    $('#enBrand').val(brandVal);
}

function verifyStaffAndInputs() {
    const selectedStaff = $('#staffSelect').val();
    const enteredPin = $('#staffPin').val().trim();

    if (!selectedStaff) {
        alert("សូមជ្រើសរើសឈ្មោះបុគ្គលិកប្រតិបត្តិការ!");
        $('#staffSelect').focus();
        return false;
    }

    if (STAFF_CREDENTIALS[selectedStaff] !== enteredPin) {
        alert("លេខសម្ងាត់ (PIN Code) មិនត្រឹមត្រូវទេ!");
        $('#staffPin').focus();
        return false;
    }

    const inputs = document.querySelectorAll('#vehicleForm input[required]');
    for (let input of inputs) {
        if (!input.value.trim()) {
            alert("សូមបំពេញព័ត៌មានគ្រប់ប្រអប់ទាំងអស់!");
            input.focus();
            return false;
        }
    }
    return true;
}

function executeDownloadHTML() {
    if (!verifyStaffAndInputs()) return;

    const htmlContent = generateHTMLContent();
    const fileName = $('#fileNameInput').val().trim();

    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    alert(`ទាញយក File HTML (${fileName}) រួចរាល់ដោយជោគជ័យ!`);
}

async function executeSendTelegram() {
    if (!verifyStaffAndInputs()) return;

    const selectedStaff = $('#staffSelect').val();
    const plate = $('#plate').val().trim();
    const customerName = $('#customerName').val().trim() || "មិនបានបញ្ជាក់";
    const note = $('#operationNote').val().trim() || "គ្មាន";
    const qrUrl = $('#qrFullUrl').val().trim();
    const fileName = $('#fileNameInput').val().trim();

    getFramedQRBlob(async function(qrFramedBlob) {
        const captionText = `🚨 **នេះជា QR & HTML**\n` +
                            `👤 **បុគ្គលិក៖** ${selectedStaff}\n` +
                            `🙋‍♂️ **អតិថិជន៖** ${customerName}\n` +
                            `🔗 **QR Link៖** ${qrUrl}\n` +
                            `🚗 **ផ្លាកលេខ៖** ${plate}\n` +
                            `📝 **Note៖** ${note}`;

        const photoFormData = new FormData();
        photoFormData.append('chat_id', TELEGRAM_CONFIG.chatId);
        photoFormData.append('photo', qrFramedBlob, `QR_${fileName}.png`);
        photoFormData.append('caption', captionText);
        photoFormData.append('parse_mode', 'Markdown');

        try {
            const photoRes = await fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendPhoto`, {
                method: 'POST',
                body: photoFormData
            });
            const photoData = await photoRes.json();

            if (!photoData.ok) {
                alert("ផ្ញើរូបភាព QR បរាជ័យ៖ " + photoData.description);
                return;
            }

            const htmlContent = generateHTMLContent();
            const htmlBlob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });

            const docFormData = new FormData();
            docFormData.append('chat_id', TELEGRAM_CONFIG.chatId);
            docFormData.append('document', htmlBlob, fileName);
            docFormData.append('caption', `📄 File HTML ផ្លាកលេខ ${plate} (${fileName})`);

            const docRes = await fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendDocument`, {
                method: 'POST',
                body: docFormData
            });
            const docData = await docRes.json();

            if (docData.ok) {
                alert(`បានផ្ញើ QR Code មាន Frame ពណ៌ស និង File HTML (${fileName}) ចូល Telegram រួចរាល់ដោយជោគជ័យ!`);
                $('#staffPin').val('');
            } else {
                alert("ផ្ញើ File HTML បរាជ័យ៖ " + docData.description);
            }

        } catch (err) {
            alert("មានបញ្ហាក្នុងការភ្ជាប់ទៅ Telegram API");
        }
    });
}
</script>
